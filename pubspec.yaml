name: lupin_mobile
description: A mobile client for the Lupin AI assistant system with voice interface and real-time communication.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI Framework
  cupertino_icons: ^1.0.2

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Network and Communication
  dio: ^5.3.2
  web_socket_channel: ^2.4.0
  connectivity_plus: ^5.0.1

  # Audio and Media
  flutter_sound: ^9.2.13
  audioplayers: ^5.2.1
  permission_handler: ^11.0.1
  # One-shot push-to-talk WAV capture for the focus-mode voice reply (S4).
  # Chosen over the in-tree flutter_sound per OSQ-2 as amended 2026-06-12
  # (F-S4-1): flutter_sound is DI-dead legacy + streaming-oriented.
  # flutter_sound itself is REMOVAL-CANDIDATE debt riding the legacy-stack
  # retirement — do not remove it as part of S4.
  record: ^5.1.2

  # Notification audio (foreground ding + on-device TTS for priority-driven alerts)
  flutter_local_notifications: ^17.2.3
  flutter_tts: ^4.2.0

  # FCM silent-relay wake-up (S5, focus-mode voice chat). Runtime init is
  # gated behind --dart-define=ENABLE_FCM (default OFF) so Stage-1 builds
  # carry NO hard dependency on google-services.json (OSQ-7 provisioning is
  # HUMAN/laptop-side; the google-services gradle plugin is applied in that
  # same pass — see the S5 Phase-0 probe runbook).
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # Local Storage
  shared_preferences: ^2.2.2
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  flutter_secure_storage: ^9.2.2

  # Authentication
  local_auth: ^2.3.0

  # Markdown rendering
  flutter_markdown: ^0.7.3

  # File sharing and opening
  share_plus: ^10.0.0
  open_file: ^3.3.2

  # Utilities
  get_it: ^7.6.4
  logger: ^2.0.2+1
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Testing
  mockito: ^5.4.2
  mocktail: ^1.0.4
  bloc_test: ^9.1.4
  network_image_mock: ^2.1.1
  integration_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  freezed: ^2.4.6

  # Code Quality
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/audio/
    - assets/images/
    - assets/fonts/
    - assets/config/

  # Fonts
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic