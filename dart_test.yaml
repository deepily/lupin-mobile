# The tag this repo's suite uses, declared so `--tags` / `--exclude-tags` name something
# the runner knows about rather than something it infers from a call site.
#
# The `pending-capture` tag (rows red on a missing fixture) was retired 2026-10-10, when the
# last fixture was captured: no test carries it any more, and a new fixture-dependent row
# should land together with its fixture instead.
tags:
  # Rows that need a real server on the wire. Venue-scheduled and submit-only — never part of
  # the local gate, and never run against :8000 ad hoc.
  live:
